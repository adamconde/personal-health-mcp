[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-health-mcp"
version = "2.6.0"
description = "Self-hosted MCP server aggregating personal health data from Google Health, Oura, and Withings behind one normalized, provider-attributed interface."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "personal-health-mcp contributors" }]
keywords = ["mcp", "health", "oura", "withings", "google-health"]

dependencies = [
    "fastmcp>=2.3.0",
    "starlette>=0.40.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
    "jinja2>=3.1.4",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
personal-health-mcp = "personal_health_mcp.server:main"

[project.urls]
Homepage = "https://github.com/OWNER/personal-health-mcp"
Repository = "https://github.com/OWNER/personal-health-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_health_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
# Put the repo root on sys.path so shared test helpers import as `tests.fakes`
# regardless of how pytest is launched (bare `pytest` vs `python -m pytest`).
pythonpath = ["."]

[tool.coverage.run]
source = ["personal_health_mcp"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["personal_health_mcp"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
