# Base compose: the app + its data volume only.
# The app is NOT published to the host — expose it with one of the overlays:
# Run from the repo root and pass --env-file .env (Compose's ${VAR} interpolation
# otherwise loads .env from this file's directory, not your cwd):
#   Cloudflare: docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/compose.cloudflared.yml up -d
#   Caddy:      docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/compose.caddy.yml up -d
#
# To pull a prebuilt image instead of building, set IMAGE and remove `build:`.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${IMAGE:-personal-health-mcp:local}
    env_file:
      - ../.env
    environment:
      DATABASE_PATH: /data/health.db
    expose:
      - "8000" # internal network only; never `ports:` here
    volumes:
      - health-data:/data
    restart: unless-stopped

volumes:
  health-data:
