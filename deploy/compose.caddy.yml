# Overlay: expose the app via Caddy with automatic Let's Encrypt TLS.
#
#   docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/compose.caddy.yml up -d
#   (run from the repo root; --env-file .env is required so ${CADDY_DOMAIN}
#    interpolates from your repo-root .env, not from this file's directory)
#
# Prereqs:
#   1. A domain whose A/AAAA record points at this host.
#   2. Ports 80 and 443 reachable from the internet (port-forwarded).
#   3. Set CADDY_DOMAIN in .env (e.g. health.example.com); PUBLIC_BASE_URL must
#      be https://<CADDY_DOMAIN>.
services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
