{% extends "base.html" %}
{% block title %}Sign in — Health MCP{% endblock %}
{% block auth_content %}
<div class="card card--elevated">
  <div style="font-size:2rem; text-align:center;">🩺</div>
  <h1 class="headline-small" style="text-align:center;">Health MCP</h1>
  <p class="body-medium muted" style="text-align:center;">Sign in to manage your health data preferences.</p>
  {% if error %}<div class="banner banner--error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="field">
      <input id="password" name="password" type="password" placeholder=" " autofocus required>
      <label for="password">Password</label>
    </div>
    <button class="btn" type="submit" style="width:100%;">Sign in</button>
  </form>
</div>
{% endblock %}
